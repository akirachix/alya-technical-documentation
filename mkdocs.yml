site_name: KNode Documentation
site_description: Technical documentation for KNode, an evidence-based matchmaking platform connecting African NGOs, collectives and funders.
site_url: https://akirachix.github.io/alya-technical-documentation/
repo_url: https://github.com/akirachix/alya-technical-documentation
repo_name: alya-technical-documentation

theme:
  name: material
  language: en
  logo: assets/brand/knode-logo-light.png
  favicon: assets/brand/knode-logo-light.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - navigation.expand
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - glightbox:
      effect: zoom
      zoomable: true
      draggable: true
      touchNavigation: true
      auto_caption: false

nav:
  - Home: index.md
  - Overview: overview.md
  - Architecture: architecture.md
  - Backend:
      - backend/index.md
      - Database and Migrations: backend/database.md
      - API Reference: backend/api-reference.md
      - Authentication and Security: backend/authentication-security.md
      - Matching Engine: backend/matching-engine.md
      - Testing: backend/testing.md
  - AI Service: ai.md
  - Frontend Web: frontend.md
  - Integrations: integrations.md
  - Glossary: glossary.md

extra:
  generator: false

copyright: KNode &mdash; evidence-based matchmaking for African NGOs and funders.
